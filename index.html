<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d2238">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Questoria">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Questoria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Layout : console rétro — barre d'état en haut, écran de jeu + boîte de dialogue à gauche, menu ▶ + panneau à droite ; tout s'empile sur mobile. Thème unique assumé : console sombre, boîtes de texte claires. */
:root{
  --console:#1d2238; --edge:#0b0e1c; --dots:#262c48;
  --box:#f8f6ec; --boxink:#1e2436; --line:#283048; --line2:#7d9bcc; --soft:#e6e2d2; --mute:#6c7189;
  --gold:#e3a826; --red:#d84040; --hpG:#45bd5c; --hpY:#e8c030; --hpR:#e04848; --blue:#3a78c8; --sel:#fff0b8;
  --c-for:#d8573e; --c-int:#4a7fd0; --c-vit:#3fa35a; --c-dis:#9a5ac8;
  --display:"Press Start 2P", ui-monospace, monospace;
  --body:"VT323", ui-monospace, "Courier New", monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--console);color:var(--boxink);font-family:var(--body);font-size:22px;line-height:1.15;
  background-image:radial-gradient(var(--dots) 1.5px,transparent 1.5px);background-size:22px 22px}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:16px 40px}
.px{font-family:var(--display);font-weight:400}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* Boîte façon JRPG : double liseré */
.box{background:var(--box);color:var(--boxink);border:4px solid var(--line);border-radius:10px;
  box-shadow:inset 0 0 0 3px var(--box),inset 0 0 0 6px var(--line2),5px 5px 0 var(--edge);padding:16px 18px;min-width:0}

/* Barre d'état */
.status{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;margin-bottom:16px}
.status .who{display:flex;align-items:center;gap:10px}
.status .who canvas{width:48px;height:48px;image-rendering:pixelated;background:var(--soft);border:3px solid var(--line);border-radius:6px}
.status .nm{font-family:var(--display);font-size:12px}
.status .cl{color:var(--mute);font-size:19px}
.hearts{display:flex;gap:3px}
.hearts svg{width:24px;height:21px}
.xpwrap{flex:1 1 220px;min-width:0}
.lbl{font-family:var(--display);font-size:9px;letter-spacing:.06em;color:var(--mute)}
.bar{height:14px;border:3px solid var(--line);background:var(--soft);border-radius:4px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--blue);box-shadow:inset 0 -3px 0 rgba(0,0,0,.18);transition:width .5s steps(10)}
.money{font-family:var(--display);font-size:12px;color:var(--gold);display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.coin{width:14px;height:14px;background:var(--gold);border:2px solid #8a5a10;border-radius:50%}

/* Grille */
.grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.left{display:grid;gap:14px;min-width:0}
.right{display:grid;gap:14px;min-width:0}

/* Écran */
.screen{position:relative;border:5px solid var(--edge);border-radius:12px;overflow:hidden;background:#000;box-shadow:0 0 0 4px var(--line),6px 6px 0 6px var(--edge)}
.screen canvas{display:block;width:100%;height:auto;image-rendering:pixelated;aspect-ratio:5/3}
.hud{position:absolute;background:var(--box);border:3px solid var(--line);border-radius:6px;padding:6px 8px;font-family:var(--display);font-size:8px;line-height:1.5;color:var(--boxink);min-width:0}
.hud.enemy{left:8px;top:8px;width:46%}
.hud.me{right:8px;bottom:8px;width:44%}
.hpbar{height:8px;border:2px solid var(--line);background:var(--soft);border-radius:3px;overflow:hidden;margin-top:3px}
.hpbar i{display:block;height:100%;transition:width .6s steps(12)}
.dmg{position:absolute;font-family:var(--display);font-size:14px;color:var(--red);text-shadow:2px 2px 0 #fff;pointer-events:none;animation:rise .9s steps(9) forwards}
@keyframes rise{to{transform:translateY(-34px);opacity:0}}
.zonetag{position:absolute;left:8px;top:8px;font-family:var(--display);font-size:8px;background:var(--box);border:3px solid var(--line);border-radius:6px;padding:6px 8px}

/* Dialogue */
.dialog{position:relative;min-height:96px;cursor:pointer}
.dialog .who{font-family:var(--display);font-size:9px;color:var(--blue);margin-bottom:6px}
.dialog p{margin:0;font-size:24px;min-height:56px}
.dialog .nxt{position:absolute;right:16px;bottom:10px;font-size:14px;color:var(--line);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* Menu ▶ */
.menu{display:grid;grid-template-columns:repeat(4,1fr);gap:2px 8px;padding:12px 14px}
@media (max-width:480px){.menu{grid-template-columns:repeat(2,1fr)}}
.mi{background:none;border:0;text-align:left;font-family:var(--display);font-size:10px;padding:8px 4px 8px 20px;position:relative;border-radius:4px;white-space:nowrap}
.mi[aria-selected="true"]{background:var(--sel)}
.mi[aria-selected="true"]::before{content:"▶";position:absolute;left:4px;top:8px;font-size:9px;animation:nudge .6s steps(2) infinite}
@keyframes nudge{50%{transform:translateX(2px)}}
@media (prefers-reduced-motion:reduce){.mi::before,.dialog .nxt,.dmg{animation:none!important}}

/* Panneau */
.h{font-family:var(--display);font-size:10px;color:var(--mute);margin:18px 0 10px;letter-spacing:.04em}
.panel>.h:first-child{margin-top:2px}
.note{color:var(--mute);font-size:20px;margin:0 0 8px}
.q{display:flex;align-items:center;gap:10px;padding:8px 6px;border-bottom:2px dashed var(--soft)}
.q:last-child{border-bottom:0}
.chk{flex:none;width:34px;height:34px;border:3px solid var(--line);border-radius:6px;background:#fff;display:grid;place-items:center;font-family:var(--display);font-size:13px;color:#fff}
.q.done .chk{background:var(--hpG)}
.q.frozen .chk{background:var(--line2)}
.q.done .qn{color:var(--mute);text-decoration:line-through}
.q.off{opacity:.5}
.q.off .chk{cursor:not-allowed}
.qt{flex:1;min-width:0}
.qn{font-size:24px;overflow-wrap:anywhere}
.qm{color:var(--mute);font-size:18px}
.tag{display:inline-block;font-family:var(--display);font-size:7px;color:#fff;padding:3px 5px 2px;border-radius:3px;vertical-align:2px;margin-right:4px}
.ico{flex:none;background:none;border:0;color:var(--mute);font-size:22px;padding:4px 6px;border-radius:4px}
.ico:hover{background:var(--soft)}
.ico.armed{color:var(--red);font-size:17px}
.btn{font-family:var(--display);font-size:9px;background:var(--gold);color:var(--boxink);border:3px solid var(--line);border-radius:6px;box-shadow:3px 3px 0 var(--line);padding:9px 12px}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}
.btn.alt{background:#fff}
.btn:disabled{background:var(--soft);color:var(--mute);cursor:not-allowed}
.banner{background:var(--sel);border:3px solid var(--line);border-radius:6px;padding:6px 10px;font-size:20px;margin-bottom:8px}
.atk{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;background:#fff;border:3px solid var(--line);border-radius:6px;padding:8px 10px;margin-bottom:8px;text-align:left;font-size:22px}
.atk:hover{background:var(--sel)}
.atk b{font-family:var(--display);font-size:9px;color:var(--red);white-space:nowrap}

/* Formulaire */
form{display:grid;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=text],select{font:inherit;font-size:22px;background:#fff;color:var(--boxink);border:3px solid var(--line);border-radius:6px;padding:5px 8px;min-width:0;color-scheme:light}
input[type=text]{flex:1 1 200px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:3px solid var(--line);border-radius:6px;background:#fff;padding:5px 9px;font-size:20px}
.seg button[aria-pressed="true"]{background:var(--sel);box-shadow:inset 0 -4px 0 var(--gold)}
.day{width:38px;height:38px;padding:0!important;text-align:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:#fff;border:2px dashed var(--mute);border-radius:6px;padding:3px 8px;font-size:19px}

/* Sac */
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.item{background:#fff;border:3px solid var(--line);border-radius:8px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center}
.item canvas{width:56px;height:56px;image-rendering:pixelated;background:var(--soft);border:2px solid var(--line);border-radius:4px}
.item .nm{font-size:20px;line-height:1}
.item .sub{color:var(--mute);font-size:17px;line-height:1}
.item.eq{background:var(--sel)}

/* Héros */
.classes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.cls{background:#fff;border:3px solid var(--line);border-radius:8px;padding:8px 10px;text-align:left}
.cls[aria-pressed="true"]{background:var(--sel)}
.cls b{font-family:var(--display);font-size:9px;display:block;margin-bottom:4px}
.cls span{font-size:18px;color:var(--mute)}
.sw{display:flex;gap:6px;flex-wrap:wrap}
.sw button{width:30px;height:30px;border:3px solid var(--line);border-radius:6px}
.sw button[aria-pressed="true"]{outline:3px solid var(--gold);outline-offset:1px}
.attr{display:grid;grid-template-columns:120px 1fr 54px;gap:10px;align-items:center;margin-bottom:6px}
.attr .bar{margin:0}
.attr b{font-family:var(--display);font-size:9px}
.attr span{font-family:var(--display);font-size:9px;text-align:right;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.kv div{background:#fff;border:3px solid var(--line);border-radius:6px;padding:8px 4px}
.kv b{display:block;font-family:var(--display);font-size:13px;margin-bottom:4px;font-variant-numeric:tabular-nums}
.kv small{color:var(--mute);font-size:18px}

/* Succès */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.badge{display:flex;gap:8px;align-items:center;background:#fff;border:3px solid var(--line);border-radius:8px;padding:8px}
.badge canvas{width:32px;height:32px;image-rendering:pixelated;flex:none}
.badge b{font-family:var(--display);font-size:8px;display:block;margin-bottom:3px;line-height:1.4}
.badge span{font-size:17px;color:var(--mute);line-height:1}
.badge.lock{opacity:.45;filter:grayscale(1)}
.heat{overflow-x:auto}
.heat table{border-collapse:separate;border-spacing:3px}
.heat td{width:16px;height:16px;border-radius:3px;padding:0}
.heat th{font-weight:400;font-size:16px;color:var(--mute);padding-right:4px;text-align:right}
.zones .z{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 4px;border-bottom:2px dashed var(--soft)}
.zones .z:last-child{border-bottom:0}
.zones .z b{font-size:23px;font-weight:400}
.pill{font-family:var(--display);font-size:7px;padding:4px 6px;border-radius:3px;border:2px solid var(--line);white-space:nowrap}

.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 20px);transform:translateX(-50%);z-index:20;max-width:calc(100% - 32px);text-align:center;font-family:var(--display);font-size:11px;line-height:1.6}
.float{position:fixed;pointer-events:none;font-family:var(--display);font-size:11px;text-shadow:2px 2px 0 var(--edge);animation:rise 1s steps(10) forwards;z-index:19}
.foot{color:#8f96b8;font-size:18px;text-align:center;margin-top:18px}
</style>
<style>html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>


<div class="wrap">
  <div class="box status">
    <div class="who"><canvas id="face" width="16" height="16"></canvas><div><div class="nm" id="sName"></div><div class="cl" id="sClass"></div></div></div>
    <div><div class="lbl">ÉNERGIE DU JOUR</div><div class="hearts" id="hearts"></div></div>
    <div class="xpwrap"><div class="lbl" id="sLvl"></div><div class="bar"><i id="sXp"></i></div></div>
    <div class="money"><span class="coin"></span><span id="sGold">0</span></div>
  </div>

  <div class="grid">
    <div class="left">
      <div class="screen" id="screen">
        <canvas id="map" width="320" height="192"></canvas>
        <canvas id="battle" width="240" height="144" hidden></canvas>
        <div class="zonetag" id="zoneTag"></div>
        <div class="hud enemy" id="hudE" hidden></div>
        <div class="hud me" id="hudM" hidden></div>
      </div>
      <div class="box dialog" id="dialog" role="status" tabindex="0" aria-label="Boîte de dialogue, touche pour continuer">
        <div class="who" id="dWho">LE VIEUX SAGE</div>
        <p id="dTxt"></p>
        <span class="nxt" aria-hidden="true">▼</span>
      </div>
    </div>

    <div class="right">
      <div class="box menu" id="menu" role="tablist"></div>
      <div class="box panel" id="panel"></div>
    </div>
  </div>
  <p class="foot">Ta progression est enregistrée dans ce navigateur.</p>
</div>

<script>
(function(){
/* ================== DONNÉES ================== */
const CATS={for:{n:"Force",c:"#d8573e"},int:{n:"Intellect",c:"#4a7fd0"},vit:{n:"Vitalité",c:"#3fa35a"},dis:{n:"Discipline",c:"#9a5ac8"}};
const CLASSES={guerrier:{n:"Guerrier",a:"for"},erudit:{n:"Érudit",a:"int"},moine:{n:"Moine",a:"vit"},paladin:{n:"Paladin",a:"dis"}};
const DAYS=[["L",1],["M",2],["M",3],["J",4],["V",5],["S",6],["D",0]];
const ZONES=[
  {n:"Plaine de l'Aube",lv:1,g:"#78c050",d:"#5aa040",sky:["#88c8f0","#d0ecf8"],roof:"#d84040"},
  {n:"Forêt des Murmures",lv:3,g:"#4f9a48",d:"#3a7a38",sky:["#5a9a88","#a8d4b0"],roof:"#8a5a2a"},
  {n:"Désert de Cuivre",lv:5,g:"#e8c878",d:"#d0a858",sky:["#f0a868","#f8dc98"],roof:"#c86a2a"},
  {n:"Pics Gelés",lv:8,g:"#e8f0f8",d:"#c0d0e4",sky:["#90acd8","#e0eaf8"],roof:"#3a78c8"},
  {n:"Citadelle Céleste",lv:12,g:"#9a88d0",d:"#7a68b8",sky:["#3a2a6a","#8a6ac8"],roof:"#e3a826"},
];
const ITEMS=[
  {id:"sw1",slot:"weapon",n:"Épée en bois",p:20},{id:"sw2",slot:"weapon",n:"Lame d'acier",p:70},
  {id:"ax1",slot:"weapon",n:"Hache du nord",p:95},{id:"st1",slot:"weapon",n:"Bâton runique",p:130},
  {id:"hd1",slot:"head",n:"Capuche verte",p:25},{id:"hd2",slot:"head",n:"Heaume",p:80},{id:"hd3",slot:"head",n:"Couronne",p:180},
  {id:"bd3",slot:"body",n:"Tenue de rôdeur",p:45},{id:"bd1",slot:"body",n:"Robe de mage",p:60},{id:"bd2",slot:"body",n:"Armure de plaques",p:120},
];
const CONSUM=[
  {id:"scroll",n:"Parchemin de repos",p:30,d:"Protège tes séries : les quêtes manquées hier comptent comme faites (sans XP)."},
  {id:"potion",n:"Potion de sagesse",p:25,d:"+50 % d'XP sur toutes les quêtes validées aujourd'hui."},
];
const SLOT={weapon:"Arme",head:"Tête",body:"Corps"};
const HAIR=["#7a4a2a","#2a2238","#e0b050","#c04830","#8a96b0"];
const TUNIC=["#c94b4b","#3a78c8","#3f9a52","#8a4ab8","#e08a2a"];
const SKIN=["#f2c79a","#d9a066","#a0663c","#6e4024"];
const TEMPLATES=[["Boire 2 L d'eau","vit",10],["Lire 20 minutes","int",20],["Méditer 10 minutes","vit",10],["Courir 30 minutes","for",35],["Séance de muscu","for",35],["Coucher avant 23 h","vit",20],["Planifier sa journée","dis",10],["Ranger 15 minutes","dis",10],["Apprendre une langue","int",20],["Étirements","for",10]];
const TIPS=[
  "Bienvenue, aventurier ! Chaque habitude cochée nourrit ton héros en XP et en or.",
  "Une petite quête accomplie vaut mieux qu'une grande remise à demain.",
  "Le monstre de la semaine perd des PV à chaque quête validée. Termine-le avant dimanche !",
  "Ton métier donne +20 % d'XP sur les quêtes de son attribut. Choisis-le dans HÉROS.",
  "Un jour difficile ? Le Parchemin de repos protège tes séries.",
  "Les Pics Gelés s'ouvrent au niveau 8. On raconte qu'il y fait froid… mais calme.",
  "Pas besoin d'être parfait. Revenir le lendemain, c'est ça la vraie quête.",
];

/* ================== OUTILS ================== */
const key=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const now=new Date();now.setHours(12,0,0,0);
const TODAY=key(now),WD=now.getDay();
const monday=d=>addDays(d,-((d.getDay()+6)%7));
const MON=monday(now),WEEK=key(MON);
const WEEKIDX=Math.round((MON-new Date(2024,0,1,12))/(7*864e5));
const need=l=>40+l*20;
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=id=>document.getElementById(id);
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ================== ÉTAT ================== */
function fresh(){
  const all=[0,1,2,3,4,5,6];
  const h=[
    {id:uid(),name:"Boire 2 L d'eau",cat:"vit",xp:10,days:all,done:{}},
    {id:uid(),name:"Lire 20 minutes",cat:"int",xp:20,days:all,done:{}},
    {id:uid(),name:"Séance de muscu",cat:"for",xp:35,days:[1,3,5],done:{}},
    {id:uid(),name:"Méditer 10 minutes",cat:"vit",xp:10,days:all,done:{}},
    {id:uid(),name:"Planifier sa journée",cat:"dis",xp:10,days:[1,2,3,4,5],done:{}},
  ];
  for(let i=1;i<=6;i++){const d=addDays(now,-i),k=key(d);
    h[0].done[k]=10; if(i<4)h[1].done[k]=20; if(i%2)h[3].done[k]=10;
    if(h[2].days.includes(d.getDay())&&i<5)h[2].done[k]=35;}
  return {v:2,name:"Héros",cls:"guerrier",look:{hair:0,tunic:0,skin:0},lvl:2,xp:30,gold:40,habits:h,
    owned:["sw1"],eq:{weapon:"sw1",head:null,body:null},inv:{scroll:1,potion:0},boost:null,
    attr:{for:40,int:60,vit:80,dis:10},stats:{total:24},perfect:{},bosses:{},badges:{}};
}
let S=null;
try{S=JSON.parse(localStorage.getItem("questoria2"))}catch(e){}
if(!S||S.v!==2){
  let old=null;try{old=JSON.parse(localStorage.getItem("questoria"))}catch(e){}
  S=fresh();
  if(old&&old.habits){ // reprise de la v1
    Object.assign(S,{lvl:old.lvl||1,xp:old.xp||0,gold:old.gold||0,owned:old.owned||[],eq:Object.assign({weapon:null,head:null,body:null},old.eq||{})});
    S.habits=old.habits.map(h=>{const d={};for(const k in h.done)d[k]=h.xp;return {id:h.id||uid(),name:h.name,cat:"dis",xp:h.xp,days:h.days,done:d}});
    S.attr={for:0,int:0,vit:0,dis:0};S.stats={total:0};S.inv={scroll:0,potion:0};
  }
}
const save=()=>{try{localStorage.setItem("questoria2",JSON.stringify(S))}catch(e){}};

/* ================== PIXEL ART ================== */
const FRONT=["................",".....kkkkkk.....","....khhhhhhk....","....khhhhhhk....","....ksssssskk...","....ksekseks....","....kssssssk....",".....kssssk.....","....kbbbbbbk....","...ksbbbbbbsk...","...ksbbccbbsk...","....kbbbbbbk....","....kppkkppk....","....kppk.kppk...","....kook.kook...","....kkk..kkk...."];

const sched=(h,wd=WD)=>h.days.includes(wd);
function streak(h){
  let n=0,d=new Date(now);if(!h.done[TODAY])d=addDays(d,-1);
  for(let i=0;i<400;i++){if(h.days.includes(d.getDay())){if(h.done[key(d)])n++;else break;}d=addDays(d,-1)}
  return n;
}
function zoneIdx(){let z=0;ZONES.forEach((t,i)=>{if(S.lvl>=t.lv)z=i});return z}
function bossState(){
  let hp=0,dmg=0;
  for(let i=0;i<7;i++){const d=addDays(MON,i),k=key(d);
    S.habits.forEach(h=>{if(sched(h,d.getDay()))hp+=h.xp;const v=h.done[k];if(v>0)dmg+=v})}
  hp=Math.max(60,Math.round(hp*0.75));
  return {hp,dmg:Math.min(dmg,hp),left:Math.max(0,hp-dmg),dead:dmg>=hp};
}
function gain(xp){
  S.xp+=xp;let up=0;
  while(S.xp>=need(S.lvl)){S.xp-=need(S.lvl);S.lvl++;up++}
  while(S.xp<0&&S.lvl>1){S.lvl--;S.xp+=need(S.lvl)}
  if(S.xp<0)S.xp=0;return up;
}
function award(h){
  let xp=h.xp;
  if(CLASSES[S.cls]&&CLASSES[S.cls].a===h.cat)xp*=1.2;
  if(S.boost===TODAY)xp*=1.5;
  return Math.round(xp);
}
function attrLvl(v){const l=Math.floor(Math.sqrt(v/25))+1,a=25*(l-1)**2,b=25*l**2;return {l,p:(v-a)/(b-a)}}

const mapC=$("map"),mx=mapC.getContext("2d");
const pathY=x=>6+Math.round(1.6*Math.sin(x*0.75));
const rnd=(x,y,s)=>{const n=Math.sin(x*12.9898+y*78.233+(s||0)*37.719)*43758.5453;return n-Math.floor(n)};
const ZX=[2,6,10,14,18];
function isPath(x,y){const a=pathY(x),b=x>0?pathY(x-1):a;return y>=Math.min(a,b)&&y<=Math.max(a,b)}
function isWater(x,y){return (x===12&&!isPath(x,y))||((x-0.5)**2+(y-1)**2<3.2&&x<3)}
function R(x,X,Y,w,h,c){x.fillStyle=c;x.fillRect(X,Y,w,h)}
function drawMap(fr){
  const x=mx;
  for(let ty=0;ty<12;ty++)for(let tx=0;tx<20;tx++){
    const z=ZONES[Math.min(4,Math.floor(tx/4))],X=tx*16,Y=ty*16;
    R(x,X,Y,16,16,z.g);
    R(x,X+Math.floor(rnd(tx,ty,1)*14),Y+Math.floor(rnd(tx,ty,2)*14),2,1,z.d);
    R(x,X+Math.floor(rnd(tx,ty,3)*14),Y+Math.floor(rnd(tx,ty,4)*14),1,2,z.d);
    if(isWater(tx,ty)){R(x,X,Y,16,16,"#3a78c8");const o=(fr+tx+ty)%2*4;R(x,X+2+o,Y+4,6,1,"#8ac0f0");R(x,X+6-o,Y+11,6,1,"#8ac0f0");continue}
    if(isPath(tx,ty)){
      if(tx===12){R(x,X,Y+2,16,12,"#8a5a2b");for(let i=0;i<16;i+=4)R(x,X+i,Y+2,1,12,"#5a3a1a");R(x,X,Y+2,16,1,"#5a3a1a");R(x,X,Y+13,16,1,"#5a3a1a");continue}
      R(x,X,Y,16,16,tx>=16?"#c8b8f0":tx>=8&&tx<12?"#f4e0a8":"#d8bc84");
      R(x,X+3,Y+5,2,1,"rgba(0,0,0,.12)");R(x,X+10,Y+11,2,1,"rgba(0,0,0,.12)");continue}
    if(ZX.some(zx=>zx===tx&&pathY(zx)-1===ty))continue;
    const zi=Math.min(4,Math.floor(tx/4)),r=rnd(tx,ty,5);
    if(zi===0&&r<.22){R(x,X+5,Y+6,2,2,"#f8f0f8");R(x,X+6,Y+5,1,1,"#e85a8a");R(x,X+10,Y+10,2,2,"#ffe060")}
    if(zi===1&&r<.55){R(x,X+3,Y+2,10,8,"#2a6a30");R(x,X+2,Y+4,12,5,"#2a6a30");R(x,X+5,Y+3,4,3,"#4a9a48");R(x,X+7,Y+10,2,4,"#6a4422")}
    if(zi===2&&r<.16){R(x,X+7,Y+3,3,11,"#3a8a48");R(x,X+4,Y+6,2,4,"#3a8a48");R(x,X+4,Y+9,4,1,"#3a8a48");R(x,X+11,Y+5,2,4,"#3a8a48");R(x,X+9,Y+8,4,1,"#3a8a48")}
    if(zi===3&&r<.35){R(x,X+7,Y+2,2,2,"#ffffff");R(x,X+5,Y+4,6,3,"#2a5a48");R(x,X+3,Y+7,10,4,"#2a5a48");R(x,X+5,Y+4,2,1,"#ffffff");R(x,X+7,Y+11,2,3,"#6a4422")}
    if(zi===4&&r<.2){R(x,X+6,Y+3,4,10,"#c8f0ff");R(x,X+7,Y+1,2,2,"#ffffff");R(x,X+6,Y+3,1,10,"#7ac8e8")}
  }
  // bâtiments
  ZX.forEach((zx,i)=>{const X=zx*16,Y=(pathY(zx)-1)*16,z=ZONES[i];
    if(i===4){R(x,X+1,Y+3,14,13,"#f0eaff");R(x,X,Y,4,6,"#f0eaff");R(x,X+12,Y,4,6,"#f0eaff");R(x,X,Y,4,2,z.roof);R(x,X+12,Y,4,2,z.roof);R(x,X+6,Y+9,4,7,"#3a2a6a");R(x,X+1,Y+3,14,1,"#b8a8e0")}
    else{R(x,X+2,Y+7,12,9,"#f8f0e0");R(x,X+1,Y+5,14,3,z.roof);R(x,X+3,Y+3,10,2,z.roof);R(x,X+5,Y+1,6,2,z.roof);R(x,X+7,Y+10,3,6,"#6a4422");R(x,X+3,Y+9,3,3,"#8ac0f0");R(x,X+11,Y+9,2,3,"#8ac0f0")}
  });
  // zones verrouillées
  ZONES.forEach((z,i)=>{if(S.lvl<z.lv){R(x,i*64,0,64,192,"rgba(14,16,34,.58)");
    const X=ZX[i]*16+4,Y=(pathY(ZX[i])-1)*16+3;R(x,X+2,Y,4,2,"#e3a826");R(x,X+1,Y+1,1,4,"#e3a826");R(x,X+6,Y+1,1,4,"#e3a826");R(x,X,Y+5,8,6,"#e3a826");R(x,X+3,Y+7,2,2,"#1e2436")}});
  // héros
  const zi=zoneIdx(),hx=ZX[zi]*16+(fr%2?1:0),hy=pathY(ZX[zi])*16-3-(fr%2);
  R(x,hx+3,hy+15,10,2,"rgba(0,0,0,.25)");
  drawHero(x,hx,hy,1,false);
}

const batC=$("battle"),bx=batC.getContext("2d");
let anim=null;
function drawBattle(shake,flash,faint){
  const z=ZONES[zoneIdx()],x=bx;
  const g=x.createLinearGradient(0,0,0,90);g.addColorStop(0,z.sky[0]);g.addColorStop(1,z.sky[1]);
  x.fillStyle=g;x.fillRect(0,0,240,144);
  R(x,0,84,240,60,z.g);for(let i=0;i<30;i++)R(x,Math.floor(rnd(i,1,9)*236),84+Math.floor(rnd(i,2,9)*58),3,1,z.d);
  x.fillStyle=z.d;x.beginPath();x.ellipse(178,76,46,9,0,0,7);x.fill();
  x.beginPath();x.ellipse(66,136,54,10,0,0,7);x.fill();
  const bs=bossState();
  if(!(bs.dead&&!anim)||faint!==undefined){
    x.globalAlpha=faint!==undefined?Math.max(0,1-faint):1;
    sprite(x,BOSS.rows,BOSS.pal,146+(shake||0),12+(faint?faint*20:0),4,flash);
    x.globalAlpha=1;
  }
  drawHero(x,34,72,4,true);
}
function hud(){
  const bs=bossState(),pct=bs.left/bs.hp,col=pct>.5?"var(--hpG)":pct>.2?"var(--hpY)":"var(--hpR)";
  $("hudE").innerHTML=`${esc(BOSS.n)}${bs.dead?" ✕":""}<div class="hpbar"><i style="width:${pct*100}%;background:${col}"></i></div><div style="text-align:right">PV ${bs.left}/${bs.hp}</div>`;
  $("hudM").innerHTML=`${esc(S.name)} <span style="float:right">N.${S.lvl}</span><div class="hearts" style="margin-top:4px">${heartsHTML(14)}</div>`;
}
function attackAnim(dmg,killed){
  const st=performance.now(),D=killed?1300:550;
  const f=document.createElement("div");f.className="dmg";f.textContent="-"+dmg;f.style.right="18%";f.style.top="14%";$("screen").appendChild(f);setTimeout(()=>f.remove(),900);
  if(reduce){drawBattle();hud();return}
  anim=true;
  (function step(t){const p=(t-st)/D;
    if(p>=1){anim=null;drawBattle();hud();return}
    if(killed&&p>.45)drawBattle(0,false,(p-.45)/.55);
    else drawBattle(Math.round(Math.sin(p*40)*5*(1-p)),Math.floor(p*12)%2===0&&p<.4);
    requestAnimationFrame(step)})(st);
}

function heartSVG(f,s){
  const pts=[[1,0],[2,0],[4,0],[5,0],[0,1],[1,1],[2,1],[3,1],[4,1],[5,1],[6,1],[0,2],[1,2],[2,2],[3,2],[4,2],[5,2],[6,2],[1,3],[2,3],[3,3],[4,3],[5,3],[2,4],[3,4],[4,4],[3,5]];
  const r=pts.map(([x,y])=>{const on=f>=1||(f>=.5&&x<=3);return `<rect x="${x}" y="${y}" width="1" height="1" fill="${on?"#d84040":"#c9c4b4"}"/>`}).join("");
  return `<svg viewBox="-.5 -.5 8 7" width="${s}" height="${s*.875}" shape-rendering="crispEdges" aria-hidden="true"><rect x="0" y="0" width="0" height="0"/>${r}<rect x="1" y="1" width="1" height="1" fill="rgba(255,255,255,${f>0?.7:0})"/></svg>`;
}
function heartsHTML(s){
  const td=S.habits.filter(h=>sched(h)),n=td.length?td.filter(h=>h.done[TODAY]).length/td.length*5:0;
  let o="";for(let i=0;i<5;i++)o+=heartSVG(Math.max(0,Math.min(1,Math.round((n-i)*2)/2)),s);return o;
}

  el.className="q"+(v>0?" done":"")+(v<0?" frozen":"")+(on?"":" off");
  el.innerHTML=`<button class="chk" ${on?"":"disabled"} aria-label="Valider : ${esc(h.name)}">${v?"✓":""}</button>
    <div class="qt"><div class="qn">${esc(h.name)}</div>
    <div class="qm"><span class="tag" style="background:${c.c}">${c.n.slice(0,3).toUpperCase()}</span>+${h.xp} XP · ${daysLabel(h.days)}${s?` · série ${s}`:""}</div></div>
    <button class="ico ed" aria-label="Modifier">✎</button><button class="ico del" aria-label="Supprimer">×</button>`;
  if(on)el.querySelector(".chk").onclick=e=>toggle(h,e.currentTarget);
  el.querySelector(".ed").onclick=()=>{editId=h.id;go("edit")};
  const del=el.querySelector(".del");
  del.onclick=()=>{if(del.classList.contains("armed")){S.habits=S.habits.filter(x=>x!==h);save();refresh();return}
    del.classList.add("armed");del.textContent="Supprimer ?";setTimeout(()=>{if(del.isConnected){del.classList.remove("armed");del.textContent="×"}},2500)};
  return el;
}

function renderPanel(){
  const P=$("panel");P.innerHTML="";
  const H=t=>{const d=document.createElement("div");d.className="h";d.textContent=t;P.appendChild(d);return d};
  const add=html=>{const d=document.createElement("div");d.innerHTML=html;P.appendChild(d);return d};

  if(tab==="quetes"){
    const on=S.habits.filter(h=>sched(h)),off=S.habits.filter(h=>!sched(h));
    if(S.boost===TODAY)add(`<div class="banner">Potion de sagesse active : +50 % d'XP aujourd'hui.</div>`);
    H(`QUÊTES DU JOUR · ${on.filter(h=>h.done[TODAY]).length}/${on.length}`);
    if(!on.length)add(`<p class="note">Aucune quête aujourd'hui. Ajoute-en une avec +QUÊTE.</p>`);
    on.forEach(h=>P.appendChild(questRow(h,true)));
    if(off.length){H("AU REPOS AUJOURD'HUI");off.forEach(h=>P.appendChild(questRow(h,false)))}
  }

  if(tab==="combat"){
    const bs=bossState();
    H("BOSS DE LA SEMAINE");
    add(`<p class="note">${esc(BOSS.n)} · ${bs.left} PV restants sur ${bs.hp}. Chaque quête validée cette semaine lui inflige ses XP en dégâts. Récompense : ${60+10*S.lvl} or.</p>`);
    H("ATTAQUES DISPONIBLES");
    const todo=S.habits.filter(h=>sched(h)&&!h.done[TODAY]);
    if(bs.dead)add(`<div class="banner">Victoire ! Reviens lundi pour affronter le prochain monstre.</div>`);
    if(!todo.length)add(`<p class="note">Plus d'attaque aujourd'hui. Toutes tes quêtes sont faites !</p>`);
    todo.forEach(h=>{const b=document.createElement("button");b.className="atk";
      b.innerHTML=`<span>▶ ${esc(h.name)}</span><b>${award(h)} DÉG.</b>`;b.onclick=()=>toggle(h,b,true);P.appendChild(b)});
  }

  if(tab==="carte"){
    H("RÉGIONS DU ROYAUME");
    const d=add(`<div class="zones">${ZONES.map((z,i)=>{const cur=i===zoneIdx(),open=S.lvl>=z.lv;
      return `<div class="z"><div><b>${z.n}</b><div class="qm">Niveau ${z.lv} requis</div></div><span class="pill" style="background:${cur?"var(--sel)":open?"#fff":"var(--soft)"}">${cur?"ICI":open?"VISITÉE":"VERROUILLÉE"}</span></div>`}).join("")}</div>`);
    const nx=ZONES[zoneIdx()+1];
    if(nx){let xpLeft=need(S.lvl)-S.xp;for(let l=S.lvl+1;l<nx.lv;l++)xpLeft+=need(l);
      add(`<p class="note" style="margin-top:12px">Encore ${xpLeft} XP pour rejoindre ${nx.n}.</p>`)}
  }

  if(tab==="sac"){
    H("CONSOMMABLES");
    const g1=document.createElement("div");g1.className="shop";P.appendChild(g1);
    CONSUM.forEach(it=>{const n=S.inv[it.id]||0,d=document.createElement("div");d.className="item";
      d.innerHTML=`<canvas width="16" height="16"></canvas><div class="nm">${it.n}</div><div class="sub">En stock : ${n}</div><div class="sub" style="font-size:16px">${it.d}</div>`;
      icon(d.querySelector("canvas"),it.id);
      const r=document.createElement("div");r.className="row";r.style.justifyContent="center";
      const buy=document.createElement("button");buy.className="btn";buy.textContent=`${it.p} or`;buy.disabled=S.gold<it.p;
      buy.onclick=()=>{S.gold-=it.p;S.inv[it.id]=(S.inv[it.id]||0)+1;save();refresh();toast(`${it.n}<br>ajouté au sac`)};
      const use=document.createElement("button");use.className="btn alt";use.textContent="Utiliser";use.disabled=!n;use.onclick=()=>useItem(it.id);
      r.append(buy,use);d.appendChild(r);g1.appendChild(d)});
    H("ÉQUIPEMENT");
    const g=document.createElement("div");g.className="shop";P.appendChild(g);
    ITEMS.forEach(it=>{const own=S.owned.includes(it.id),eq=S.eq[it.slot]===it.id,d=document.createElement("div");d.className="item"+(eq?" eq":"");
      d.innerHTML=`<canvas width="16" height="16"></canvas><div class="nm">${it.n}</div><div class="sub">${SLOT[it.slot]}</div>`;
      const c=d.querySelector("canvas").getContext("2d"),e={weapon:null,head:null,body:null};e[it.slot]=it.id;drawHero(c,0,0,1,false,e);
      const b=document.createElement("button");b.className="btn";
      if(eq){b.textContent="Retirer";b.classList.add("alt");b.onclick=()=>{S.eq[it.slot]=null;save();refresh()}}
      else if(own){b.textContent="Équiper";b.classList.add("alt");b.onclick=()=>{S.eq[it.slot]=it.id;save();refresh()}}
      else{b.textContent=`${it.p} or`;b.disabled=S.gold<it.p;b.onclick=()=>{S.gold-=it.p;S.owned.push(it.id);S.eq[it.slot]=it.id;const nb=checkBadges();save();refresh();toast(`${it.n}<br>équipé !`+(nb.length?`<br>Succès : ${nb.join(", ")}`:""))}}
      d.appendChild(b);g.appendChild(d)});
  }

  if(tab==="heros"){
    H("IDENTITÉ");
    const r=add(`<div class="row"><input type="text" id="heroName" maxlength="14" aria-label="Nom du héros"></div>`);
    const inp=r.querySelector("input");inp.value=S.name;inp.oninput=()=>{S.name=inp.value.trim()||"Héros";save();renderStatus()};
    H("MÉTIER");
    const cl=add(`<div class="classes">${Object.entries(CLASSES).map(([k,c])=>`<button class="cls" data-k="${k}" aria-pressed="${S.cls===k}"><b>${c.n}</b><span>+20 % XP ${CATS[c.a].n}</span></button>`).join("")}</div>`);
    cl.querySelectorAll(".cls").forEach(b=>b.onclick=()=>{S.cls=b.dataset.k;save();refresh();say(`Te voilà ${CLASSES[S.cls].n} ! Tes quêtes de ${CATS[CLASSES[S.cls].a].n} rapportent plus d'XP.`)});
    H("APPARENCE");
    [["Cheveux","hair",HAIR],["Tunique","tunic",TUNIC],["Peau","skin",SKIN]].forEach(([l,k,arr])=>{
      const d=add(`<div class="row" style="margin-bottom:8px"><span style="width:90px">${l}</span><div class="sw">${arr.map((c,i)=>`<button style="background:${c}" data-i="${i}" aria-label="${l} ${i+1}" aria-pressed="${S.look[k]===i}"></button>`).join("")}</div></div>`);
      d.querySelectorAll("button").forEach(b=>b.onclick=()=>{S.look[k]=+b.dataset.i;save();refresh()})});
    H("ATTRIBUTS");
    add(Object.entries(CATS).map(([k,c])=>{const a=attrLvl(S.attr[k]||0);return `<div class="attr"><b style="color:${c.c}">${c.n.toUpperCase()}</b><div class="bar"><i style="width:${a.p*100}%;background:${c.c}"></i></div><span>N.${a.l}</span></div>`}).join(""));
    H("STATISTIQUES");
    add(`<div class="kv"><div><b>${S.stats.total}</b><small>Quêtes</small></div><div><b>${Object.keys(S.perfect).length}</b><small>Jours parfaits</small></div><div><b>${Object.keys(S.bosses).length}</b><small>Boss vaincus</small></div></div>`);
  }

  if(tab==="succes"){
    H(`SUCCÈS · ${Object.keys(S.badges).length}/${BADGES.length}`);
    const g=add(`<div class="badges">${BADGES.map(b=>`<div class="badge${S.badges[b.id]?"":" lock"}"><canvas width="8" height="8" data-c="${b.c}"></canvas><div><b>${b.n}</b><span>${b.d}</span></div></div>`).join("")}</div>`);
    g.querySelectorAll("canvas").forEach(c=>medal(c,c.dataset.c));
    H("12 DERNIÈRES SEMAINES");
    const start=addDays(MON,-77);let rows="";
    DAYS.forEach(([l,wd],ri)=>{rows+=`<tr><th>${l}</th>`;
      for(let w=0;w<12;w++){const d=addDays(start,w*7+ri);let bg="transparent";
        if(d<=now){const sc=S.habits.filter(h=>sched(h,d.getDay()));const k=key(d);
          const f=sc.length?sc.filter(h=>h.done[k]).length/sc.length:0;
          bg=f===0?"var(--soft)":f<.34?"#b8dca8":f<.67?"#78c050":f<1?"#45a040":"#2a7a30"}
        rows+=`<td style="background:${bg}" title="${key(d)}"></td>`}
      rows+="</tr>"});
    add(`<div class="heat"><table aria-label="Historique">${rows}</table></div><p class="note" style="margin-top:8px">Plus la case est foncée, plus tu as validé de quêtes ce jour-là.</p>`);
  }

  if(tab==="new"||tab==="edit"){
    const h=editId?S.habits.find(x=>x.id===editId):null;
    let cat=h?h.cat:"vit",xp=h?h.xp:20,days=new Set(h?h.days:[0,1,2,3,4,5,6]);
    if(!h){H("MODÈLES RAPIDES");
      const t=add(`<div class="chips">${TEMPLATES.map((t,i)=>`<button class="chip" data-i="${i}" type="button">${t[0]}</button>`).join("")}</div>`);
      t.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{const tp=TEMPLATES[+b.dataset.i];$("fName").value=tp[0];cat=tp[1];xp=tp[2];paint();$("fName").focus()})}
    H(h?"MODIFIER LA QUÊTE":"NOUVELLE QUÊTE");
    const f=document.createElement("form");P.appendChild(f);
    f.innerHTML=`<input type="text" id="fName" maxlength="60" required placeholder="Ex. Lire 20 minutes" aria-label="Nom">
      <div><div class="lbl" style="margin-bottom:6px">ATTRIBUT</div><div class="seg" id="fCat"></div></div>
      <div><div class="lbl" style="margin-bottom:6px">DIFFICULTÉ</div><div class="seg" id="fXp"></div></div>
      <div><div class="lbl" style="margin-bottom:6px">JOURS</div><div class="seg" id="fDays"></div></div>
      <div class="row"><button class="btn" type="submit">${h?"Enregistrer":"Créer la quête"}</button>${h?'<button class="btn alt" type="button" id="fCancel">Annuler</button>':""}</div>`;
    if(h)f.querySelector("#fName").value=h.name;
    function paint(){
      $("fCat").innerHTML=Object.entries(CATS).map(([k,c])=>`<button type="button" data-k="${k}" aria-pressed="${cat===k}" style="color:${c.c}">${c.n}</button>`).join("");
      $("fXp").innerHTML=[[10,"Facile"],[20,"Moyen"],[35,"Difficile"],[50,"Épique"]].map(([v,l])=>`<button type="button" data-v="${v}" aria-pressed="${xp===v}">${l} · ${v}</button>`).join("");
      $("fDays").innerHTML=DAYS.map(([l,n])=>`<button type="button" class="day" data-n="${n}" aria-pressed="${days.has(n)}">${l}</button>`).join("")+`<button type="button" id="fAll">Tous</button>`;
      $("fCat").querySelectorAll("button").forEach(b=>b.onclick=()=>{cat=b.dataset.k;paint()});
      $("fXp").querySelectorAll("button").forEach(b=>b.onclick=()=>{xp=+b.dataset.v;paint()});
      $("fDays").querySelectorAll(".day").forEach(b=>b.onclick=()=>{const n=+b.dataset.n;days.has(n)?days.delete(n):days.add(n);paint()});
      $("fAll").onclick=()=>{days=new Set([0,1,2,3,4,5,6]);paint()};
    }
    paint();
    if(h)$("fCancel").onclick=()=>go("quetes");
    f.onsubmit=e=>{e.preventDefault();const n=$("fName").value.trim();if(!n)return;
      if(!days.size){toast("Choisis au moins<br>un jour");return}
      if(h)Object.assign(h,{name:n,cat,xp,days:[...days]});
      else S.habits.push({id:uid(),name:n,cat,xp,days:[...days],done:{}});
      save();toast(h?"Quête modifiée":"Nouvelle quête<br>acceptée !");go("quetes")};
  }
}
function icon(c,id){const x=c.getContext("2d");x.clearRect(0,0,16,16);
  if(id==="scroll"){R(x,3,3,10,10,"#f4e0a8");R(x,2,2,12,2,"#c8a060");R(x,2,12,12,2,"#c8a060");R(x,5,6,6,1,"#8a6a3a");R(x,5,8,6,1,"#8a6a3a");R(x,5,10,4,1,"#8a6a3a")}
  else{R(x,7,2,2,3,"#8a5a2b");R(x,6,5,4,2,"#c8f0ff");R(x,4,7,8,7,"#c8f0ff");R(x,5,9,6,4,"#9a5ac8");R(x,5,8,2,1,"#ffffff");R(x,4,14,8,1,"#7a68b8")}}
function medal(c,col){const x=c.getContext("2d");R(x,2,0,1,3,"#3a78c8");R(x,5,0,1,3,"#d84040");R(x,2,3,4,1,col);R(x,1,4,6,3,col);R(x,2,7,4,1,col);R(x,3,4,1,1,"rgba(255,255,255,.7)")}

/* ================== ACTIONS ================== */
function toggle(h,el,fromBattle){
  const before=bossState();
  const v=h.done[TODAY];
  if(v){ // annuler
    if(v>0){gain(-v);S.gold=Math.max(0,S.gold-Math.round(v/2));S.attr[h.cat]=Math.max(0,(S.attr[h.cat]||0)-v);S.stats.total=Math.max(0,S.stats.total-1)}
    delete h.done[TODAY];save();refresh();return;
  }
  const xp=award(h),gold=Math.round(xp/2);
  h.done[TODAY]=xp;const up=gain(xp);S.gold+=gold;S.attr[h.cat]=(S.attr[h.cat]||0)+xp;S.stats.total++;
  const zBefore=ZONES.filter(z=>S.lvl-up>=z.lv).length;
  floatAt(el,`+${xp} XP`,"#7ac8ff");floatAt(el,`+${gold} or`,"#f2c14e",20);
  const after=bossState();let msgs=[];
  const killed=!before.dead&&after.dead&&!S.bosses[WEEK];
  if(killed){const r=60+10*S.lvl;S.gold+=r;S.bosses[WEEK]=1;msgs.push(`${BOSS.n} est vaincu ! +${r} or`)}
  const td=S.habits.filter(x=>sched(x));
  if(td.every(x=>x.done[TODAY])&&!S.perfect[TODAY]){S.perfect[TODAY]=1;msgs.push("Journée parfaite !")}
  const nb=checkBadges();
  save();refresh();
  if(tab==="combat"||fromBattle){attackAnim(Math.min(xp,before.left)||xp,killed);
    say(killed?`Coup critique ! ${BOSS.n} est K.O. Tu remportes ${60+10*S.lvl} pièces d'or.`:`${S.name} utilise « ${h.name} » ! ${BOSS.n} perd ${xp} PV.`,"COMBAT")}
  if(up){const zA=ZONES.filter(z=>S.lvl>=z.lv).length;msgs.unshift(`NIVEAU ${S.lvl} !`+(zA>zBefore?`<br>Nouvelle région : ${ZONES[zA-1].n}`:""));
    if(zA>zBefore&&tab!=="combat")say(`Le chemin vers ${ZONES[zA-1].n} est ouvert ! Ton héros s'y installe.`)}
  nb.forEach(n=>msgs.push(`Succès : ${n}`));
  if(msgs.length)toast(msgs.join("<br>"));
}
function useItem(id){
  if(id==="potion"){
    if(S.boost===TODAY){toast("La potion est déjà<br>active aujourd'hui");return}
    S.inv.potion--;S.boost=TODAY;save();refresh();toast("Potion bue !<br>+50 % d'XP aujourd'hui");say("Tu te sens plus sage… Toutes tes quêtes d'aujourd'hui rapportent 50 % d'XP en plus.");return;
  }
  const y=addDays(now,-1),k=key(y);let n=0;
  S.habits.forEach(h=>{if(sched(h,y.getDay())&&!h.done[k]){h.done[k]=-1;n++}});
  if(!n){toast("Rien à protéger :<br>hier était complet");return}
  S.inv.scroll--;save();refresh();toast(`${n} série${n>1?"s":""} protégée${n>1?"s":""} !`);
}
function refresh(){renderStatus();renderScreen();renderPanel()}

/* ================== DÉMARRAGE ================== */
checkBadges();save();
renderMenu();renderStatus();renderScreen();renderPanel();
say(TIPS[0]);
})();
</script>

<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});</script>
